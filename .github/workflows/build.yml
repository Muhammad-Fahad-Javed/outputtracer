name: OutputTracer Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gdb \
            bubblewrap \
            util-linux
          g++ --version
          gdb --version
          prlimit --version
          unshare --help >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check build output
        run: |
          test -s .next/BUILD_ID
          test -f .next/routes-manifest.json
          test -f .next/prerender-manifest.json
          test -f .next/required-server-files.json
          test -d .next/server
          test -d .next/static
          echo "Production build artifacts verified."
